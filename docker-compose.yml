services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ragbench
      POSTGRES_PASSWORD: ragbench
      POSTGRES_DB: ragbench
    ports:
      - "${RAGBENCH_DB_PORT:-54329}:5432"
    volumes:
      - ragbench-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragbench -d ragbench"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  ragbench-db:
