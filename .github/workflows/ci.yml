name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ragbench
          POSTGRES_PASSWORD: ragbench
          POSTGRES_DB: ragbench
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U ragbench -d ragbench"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      # No API key and no provider calls: model responses are replayed from recorded fixtures.
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Coverage of core and components must stay at or above 90%
        run: uv run coverage report --include="src/ragbench/core/*,src/ragbench/components/*" --fail-under=90
      - name: Examples run as written
        run: |
          for example in examples/*.py; do
            echo "::group::$example"
            uv run python "$example"
            echo "::endgroup::"
          done
      - name: The offline experiment runs from the command line
        run: |
          uv run ragbench run configs/offline.yaml
          uv run ragbench report "$(uv run ragbench config configs/offline.yaml | sed -n 's/^run id: \([^ ]*\).*/\1/p')"

  package:
    name: Wheel installs in a clean environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          cd /tmp && /tmp/clean/bin/python -c "import ragbench; print(ragbench.__version__, len(ragbench.__all__))"
          /tmp/clean/bin/ragbench components
