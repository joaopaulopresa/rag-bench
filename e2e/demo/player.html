<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ragbench demo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #101114; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #window { position: absolute; inset: 28px 40px 96px; background: #16181d; border-radius: 12px;
    border: 1px solid #2a2d35; box-shadow: 0 18px 50px rgba(0,0,0,.45); overflow: hidden; }
  #bar { height: 34px; background: #1d2027; border-bottom: 1px solid #2a2d35; color: #8b90a0;
    font-size: 13px; display: flex; align-items: center; justify-content: center; }
  #terminal { padding: 12px 16px; }
  #caption { position: absolute; left: 0; right: 0; bottom: 26px; text-align: center;
    color: #f0efec; font-size: 22px; font-weight: 600; letter-spacing: .01em; }
</style>
</head>
<body>
<div id="window"><div id="bar">rag-bench</div><div id="terminal"></div></div>
<div id="caption"></div>
<script>
const CAST = /*CAST*/[];
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const caption = (text) => { document.getElementById("caption").textContent = text; };

async function play() {
  const term = new Terminal({
    cols: CAST.cols, rows: CAST.rows, fontSize: 15, lineHeight: 1.15, cursorBlink: false,
    fontFamily: 'ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace',
    theme: { background: "#16181d", foreground: "#d7dae0", cursor: "#d7dae0" },
  });
  term.open(document.getElementById("terminal"));
  for (const step of CAST.steps) {
    caption(step.caption);
    term.write("\x1b[38;5;78m$\x1b[0m ");
    await sleep(500);
    for (const character of step.command) {          // typed at a steady, readable pace
      term.write(character);
      await sleep(38);
    }
    await sleep(450);
    term.write("\r\n");
    let previous = 0;
    for (const [time, data] of step.events) {
      // Long pauses of the real run are shortened; nothing is reordered or invented.
      await sleep(Math.min((time - previous) * 1000 * step.speed, step.maxGap));
      previous = time;
      term.write(data);
    }
    await sleep(step.hold);
  }
  window.demoDone = true;
}
window.addEventListener("load", play);
</script>
</body>
</html>
