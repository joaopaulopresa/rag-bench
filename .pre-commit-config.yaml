repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: no-secrets
        name: never commit secrets
        entry: sh -c 'echo "refusing to commit $@" && exit 1' --
        language: system
        files: '(^|/)\.env(\..*)?$'
        exclude: '(^|/)\.env\.example$'
